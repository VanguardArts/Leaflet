[package]
name = "leaflet"
version = "0.1.0"
description = "Leaflet — Your little corner of the internet. A free and open-source bookmark manager by Vanguard Arts Software."
authors = ["Vanguard Arts Software"]
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.77.2"

[lib]
name = "leaflet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
