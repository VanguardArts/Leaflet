name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend (produces dist/ required by Tauri)
        run: npm run build
      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

  # Cross-platform release: builds native installers for Linux, Windows, and
  # macOS (Apple Silicon + Intel) and uploads them all to a single GitHub
  # Release for the pushed tag. Each matrix leg uploads to the release for
  # `github.ref_name`; fail-fast is off so one platform's failure doesn't
  # block the others.
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    # The release step creates a GitHub Release and uploads assets, so the
    # GITHUB_TOKEN needs write access to the repository contents.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: ""
            args: ""
          - platform: windows-latest
            target: ""
            args: ""
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Rust target (macOS cross-compile)
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: npm ci
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Leaflet ${{ github.ref_name }}"
          args: ${{ matrix.args }}
          releaseBody: |
            ## Install Leaflet ${{ github.ref_name }}

            Download the installer for your platform from the assets below.

            ### 🪟 Windows
            - **`.msi`** (installer) or **`-setup.exe` (NSIS)** — run it. Windows
              SmartScreen may warn because the app is unsigned; click
              **More info → Run anyway**.

            ### 🍎 macOS
            - **`.dmg`** — `aarch64` for Apple Silicon (M1/M2/M3/M4), `x86_64` for
              Intel. Gatekeeper may warn because the app is unsigned; right-click →
              **Open**, or allow it under **System Settings → Privacy & Security**.

            ### 🐧 Linux
            - **`.AppImage`** — distro-agnostic; download, `chmod +x`, then run.
            - **`.deb`** — Debian / Ubuntu / Mint: `sudo apt install ./Leaflet_*_amd64.deb`
            - **`.rpm`** — Fedora / RHEL / openSUSE: `sudo dnf install ./Leaflet-*.x86_64.rpm`

            **Usage** — see the [README](https://github.com/VanguardArts/Leaflet#readme).
            **What's new** — see the [CHANGELOG](https://github.com/VanguardArts/Leaflet/blob/main/CHANGELOG.md).

            Leaflet is free and open source ([GPL-3.0-or-later](https://github.com/VanguardArts/Leaflet/blob/main/LICENSE)). If it is useful to you, consider [sponsoring](https://github.com/sponsors/VanguardArts).
          releaseDraft: false
