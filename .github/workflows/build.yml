name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend (produces dist/ required by Tauri)
        run: npm run build
      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: npm ci
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Leaflet ${{ github.ref_name }}"
          releaseBody: |
            ## Install Leaflet ${{ github.ref_name }}

            Download the package for your Linux distro from the assets below:

            - **`.AppImage`** — distro-agnostic. Download, `chmod +x`, then run it.
            - **`.deb`** — Debian / Ubuntu / Mint: `sudo apt install ./Leaflet_*_amd64.deb`
            - **`.rpm`** — Fedora / RHEL / openSUSE: `sudo dnf install ./Leaflet-*.x86_64.rpm`

            **Usage** — see the [README](https://github.com/VanguardArts/Leaflet#readme).
            **What's new** — see the [CHANGELOG](https://github.com/VanguardArts/Leaflet/blob/main/CHANGELOG.md).

            Leaflet is free and open source ([GPL-3.0-or-later](https://github.com/VanguardArts/Leaflet/blob/main/LICENSE)). If it is useful to you, consider [sponsoring](https://github.com/sponsors/VanguardArts).
          releaseDraft: false
